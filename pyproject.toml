[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-photo-curator"
version = "0.2.0"
description = "MCP server for AI-assisted iCloud Photos curation with proposal review and gated album writes."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "icloudpy>=0.8.0",
  "keyring>=25.0.0"
]

[project.optional-dependencies]
geo = [
  "reverse_geocode>=1.6.0",
]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
  "reverse_geocode>=1.6.0",
]

# The runnable code lives in scripts/ and is executed directly (see run_mcp.py),
# so there is no importable package to build. Declaring an empty module list
# disables setuptools auto-discovery, which otherwise fails on the flat layout
# (assets/, skills/, ...). Editable installs still pull in dependencies.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
