name: Release

# Builds the Claude Desktop extension (.mcpb) and attaches it to the GitHub
# Release. Trigger it by publishing a release in the UI (Releases ->
# "Draft a new release" -> tag e.g. v0.2.0 -> Publish). You can also run it
# manually from the Actions tab to just produce a downloadable artifact.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .mcpb bundle
        run: python scripts/build_mcpb.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: dist/*.mcpb
          if-no-files-found: error

      - name: Attach bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.mcpb --clobber
